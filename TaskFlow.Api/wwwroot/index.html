<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <header class="app-header">
        <h1>TaskFlow</h1>
        <p class="subtitle">Tus notas y tareas pendientes, en un solo lugar.</p>
    </header>

    <main class="app-main">
        <section class="card">
            <h2>Nueva tarea</h2>
            <form id="task-form">
                <div class="form-group">
                    <label for="title">Título</label>
                    <input type="text" id="title" name="title" maxlength="150" required />
                </div>
                <div class="form-group">
                    <label for="description">Descripción (opcional)</label>
                    <textarea id="description" name="description" maxlength="1000" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Agregar tarea</button>
            </form>
            <p id="form-message" class="form-message"></p>
        </section>

        <section class="card">
            <h2>Mis tareas</h2>
            <p id="loading-message" class="placeholder" hidden>Cargando tareas...</p>
            <ul id="task-list" class="task-list"></ul>
            <p id="empty-message" class="placeholder" hidden>No tienes tareas todavía. ¡Agrega la primera!</p>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
